server:
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: localhost
  port: 8443
  http2:
    enabled: true

spring:
  datasource:
    # Update these if your DB name or password differs
    url: jdbc:mysql://localhost:3306/nursing_placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: app_user
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect